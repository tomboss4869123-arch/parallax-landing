<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax.</title>
    <meta name="description" content="Parallax. — Soon." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Inter:wght@300;400&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #F9F9F9;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Particle canvas ──────────────────────────── */
        #particle-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        /* ── Split echoes ────────────────────────────── */
        #echo-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ghost-text {
            position: absolute;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        .ghost-cyan {
            color: #00FFFF;
            opacity: 0;
        }

        .ghost-magenta {
            color: #FF00FF;
            opacity: 0;
        }

        /* ── Film grain ─────────────────────────────── */
        #grain-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            animation: grainShift 0.3s steps(1) infinite;
        }

        @keyframes grainShift {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-32px, 16px); }
            50% { transform: translate(16px, -24px); }
            75% { transform: translate(-8px, 32px); }
            100% { transform: translate(24px, -8px); }
        }

        /* ── Grid overlay (100px, always visible, flashlight) ── */
        #grid-overlay {
            position: fixed;
            inset: -20px;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.18) 1px, transparent 1px);
            background-size: 100px 100px;
            opacity: 1;
            --mx: 50vw;
            --my: 50vh;
            -webkit-mask-image: radial-gradient(circle 250px at var(--mx) var(--my), white, transparent);
            mask-image: radial-gradient(circle 250px at var(--mx) var(--my), white, transparent);
            animation: gridBreathe 32s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes gridBreathe {
            0%,
            100% {
                transform: translate(0, 0) skewX(0deg) skewY(0deg);
            }

            25% {
                transform: translate(10px, -8px) skewX(0.4deg) skewY(0.15deg);
            }

            50% {
                transform: translate(-6px, 12px) skewX(-0.3deg) skewY(-0.1deg);
            }

            75% {
                transform: translate(8px, -4px) skewX(0.2deg) skewY(0.25deg);
            }
        }

        /* ── Horizon line ─────────────────────────────── */
        #horizon-line {
            position: fixed;
            left: 0;
            width: 100vw;
            height: 0.5px;
            background: #111;
            opacity: 0;
            pointer-events: none;
            transform: scaleX(0);
            transform-origin: center center;
            will-change: transform, opacity;
        }

        /* ── Hero ─────────────────────────────────────── */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .fade-in-delay {
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.3s forwards;
        }

        .subtext {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #888;
            line-height: 1;
            margin-top: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .subtext:hover {
            color: #555;
        }

        .subtext {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #subtext-cursor {
            animation: blink 0.6s step-end infinite;
            font-weight: 300;
            color: #888;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .decrypt-char {
            display: inline-block;
            min-width: 0.5em;
        }

        .decrypt-char.encrypted {
            color: #ccc;
        }

        .decrypt-char.revealed {
            color: #111;
        }

        #hero-svg {
            overflow: visible;
            display: block;
            margin: 0 auto;
        }

        #period-group {
            cursor: crosshair;
        }

        /* ── Hidden cursor echo (empty-space easter egg) ── */
        #cursor-echo {
            position: fixed;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
        }

        .echo-ring {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 0.5px solid rgba(150, 150, 150, 0.15);
            border-radius: 50%;
            left: -11px;
            top: -11px;
        }

        .echo-h {
            position: absolute;
            width: 14px;
            height: 0.5px;
            left: -7px;
            top: 0;
            background: #00FFFF;
            opacity: 0.35;
        }

        .echo-v {
            position: absolute;
            height: 14px;
            width: 0.5px;
            top: -7px;
            left: 0;
            background: #FF00FF;
            opacity: 0.35;
        }

        .echo-coord {
            position: absolute;
            top: 14px;
            left: 14px;
            font: 300 7px 'Inter', sans-serif;
            color: #aaa;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        /* ── Landing page wrapper (for lens clip-path) ── */
        #landing-page {
            will-change: clip-path;
        }

        /* ── Waitlist page ──────────────────────────── */
        #waitlist-page {
            background: #F9F9F9;
        }

        #waitlist-email:focus {
            border-color: #111;
        }

        #waitlist-email::placeholder {
            color: #bbb;
        }

        #glass-btn {
            transition: border-color 0.3s ease;
        }

        #glass-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        #waitlist-back {
            transition: color 0.3s ease;
        }

        #waitlist-back:hover {
            color: #111;
        }

        #waitlist-back:hover svg {
            stroke: #111;
        }
    </style>
</head>

<body>
    <!-- Landing page (front layer — gets clip-path lens hole) -->
    <div id="landing-page" style="position:fixed;inset:0;z-index:1">
        <div id="echo-layer">
            <span class="ghost-text ghost-cyan">Parallax</span>
            <span class="ghost-text ghost-magenta">Parallax</span>
        </div>
        <canvas id="particle-canvas"></canvas>
        <div id="grain-overlay"></div>
        <div id="grid-overlay"></div>
        <div id="horizon-line"></div>

        <div id="cursor-echo">
            <div class="echo-ring"></div>
            <div class="echo-h"></div>
            <div class="echo-v"></div>
            <span class="echo-coord"></span>
        </div>

        <main class="flex items-center justify-center w-screen h-screen select-none" style="position:relative;z-index:1">
            <div id="hero-wrapper" class="text-center fade-in">
                <svg id="hero-svg" role="img" aria-label="Parallax."></svg>
                <p class="subtext" id="subtext-type"><span id="subtext-chars"></span><span id="subtext-cursor">|</span></p>
            </div>
        </main>
    </div>

    <!-- Waitlist page (back layer — revealed by lens) -->
    <section id="waitlist-page"
        class="fixed inset-0 flex items-center justify-center select-none"
        style="z-index:0; opacity:0; pointer-events:none;">

        <button id="waitlist-back"
            class="fixed top-8 left-8 flex items-center gap-2"
            style="font-family:'Inter',sans-serif; font-size:11px; font-weight:300;
                   letter-spacing:0.3em; text-transform:uppercase; color:#888;
                   background:none; border:none; cursor:pointer; padding:8px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                 stroke="#888" stroke-width="0.8">
                <line x1="10" y1="3" x2="5" y2="8"/>
                <line x1="5" y1="8" x2="10" y2="13"/>
            </svg>
            Back
        </button>

        <div class="text-center" style="max-width:420px; padding:0 24px;">
            <h2 id="waitlist-heading" style="font-family:'Space Grotesk',sans-serif; font-size:clamp(28px, 6vw, 42px);
                        font-weight:400; color:#111; letter-spacing:-0.02em;
                        line-height:1.15; margin-bottom:12px; white-space:nowrap;"></h2>

            <p style="font-family:'Inter',sans-serif; font-size:13px; font-weight:300;
                      color:#888; letter-spacing:0.05em; line-height:1.6;
                      margin-bottom:36px;">
                A new perspective — soon.
            </p>

            <form id="waitlist-form" autocomplete="off"
                  style="display:flex; flex-direction:column; gap:14px; align-items:center;">

                <input id="waitlist-email" type="email" placeholder="you@example.com"
                    required
                    style="width:100%; max-width:340px; padding:12px 16px;
                           font-family:'Inter',sans-serif; font-size:13px; font-weight:300;
                           letter-spacing:0.03em; color:#111; background:transparent;
                           border:0.5px solid #ccc; border-radius:0;
                           outline:none; transition:border-color 0.3s ease;" />

                <button type="submit" id="glass-btn"
                    style="position:relative; width:100%; max-width:340px; padding:14px 16px;
                           font-family:'Inter',sans-serif; font-size:11px; font-weight:400;
                           letter-spacing:0.3em; text-transform:uppercase;
                           color:#F9F9F9; background:#0a0a0a;
                           border:0.5px solid rgba(255,255,255,0.08); border-radius:8px;
                           cursor:pointer; overflow:hidden;">
                    <canvas id="glass-canvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:8px;"></canvas>
                    <span style="position:relative;z-index:1;">Request Access</span>
                </button>
            </form>

            <p id="waitlist-success"
               style="display:none; font-family:'Inter',sans-serif; font-size:13px;
                      font-weight:300; color:#888; letter-spacing:0.05em; margin-top:24px;">
                We'll be in touch.
            </p>
        </div>
    </section>

    <script>
        (() => {
            'use strict';

            /* ═══════════════════════════════════════════════
               UTILITIES
               ═══════════════════════════════════════════════ */
            function clamp01(v) { return Math.max(0, Math.min(1, v)); }

            /* ═══════════════════════════════════════════════
               TYPEWRITER
               ═══════════════════════════════════════════════ */
            function typewrite(el, text, delay, speed) {
                let i = 0;
                setTimeout(function type() {
                    if (i < text.length) {
                        el.textContent += text[i++];
                        setTimeout(type, speed + Math.random() * 80);
                    }
                }, delay);
            }

            typewrite(
                document.getElementById('subtext-chars'),
                'Soon.', 1800, 140
            );

            /* ═══════════════════════════════════════════════
               DECRYPTED TEXT
               ═══════════════════════════════════════════════ */
            function decryptText(el, text, { delay = 1800, speed = 50, maxIterations = 12, chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*' } = {}) {
                // Create a span for each character
                const spans = [];
                for (let i = 0; i < text.length; i++) {
                    const span = document.createElement('span');
                    span.className = 'decrypt-char encrypted';
                    span.textContent = chars[Math.floor(Math.random() * chars.length)];
                    el.appendChild(span);
                    spans.push({ el: span, target: text[i], iterations: 0, resolved: false });
                }

                setTimeout(() => {
                    let current = 0;
                    const interval = setInterval(() => {
                        // Scramble all unresolved characters
                        for (let i = current; i < spans.length; i++) {
                            if (!spans[i].resolved) {
                                spans[i].el.textContent = chars[Math.floor(Math.random() * chars.length)];
                                spans[i].iterations++;
                            }
                        }

                        // Resolve the current character after enough iterations
                        if (current < spans.length && spans[current].iterations >= maxIterations) {
                            spans[current].el.textContent = spans[current].target;
                            spans[current].el.className = 'decrypt-char revealed';
                            spans[current].resolved = true;
                            current++;
                        }

                        // All done
                        if (current >= spans.length) clearInterval(interval);
                    }, speed);
                }, delay);
            }


            /* ═══════════════════════════════════════════════
               SVG HELPERS
               ═══════════════════════════════════════════════ */
            const NS = 'http://www.w3.org/2000/svg';
            const svg = document.getElementById('hero-svg');
            const FS = 72;
            const TXT = 'Parallax';
            const FILL = '#111111';

            function mkEl(tag, a = {}) {
                const e = document.createElementNS(NS, tag);
                for (const [k, v] of Object.entries(a)) e.setAttribute(k, String(v));
                return e;
            }
            const txtAttrs = {
                'font-family': "'Space Grotesk', sans-serif",
                'font-size': FS, 'font-weight': 400,
                'letter-spacing': '-0.02em', fill: FILL
            };

            /* ═══════════════════════════════════════════════
               SPRING
               ═══════════════════════════════════════════════ */
            class Spring {
                constructor(k = 300, d = 20) {
                    this.k = k; this.d = d;
                    this.px = 0; this.py = 0;
                    this.vx = 0; this.vy = 0;
                    this.tx = 0; this.ty = 0;
                }
                aim(x, y) { this.tx = x; this.ty = y; }
                tick(dt) {
                    this.vx += (-this.k * (this.px - this.tx) - this.d * this.vx) * dt;
                    this.vy += (-this.k * (this.py - this.ty) - this.d * this.vy) * dt;
                    this.px += this.vx * dt; this.py += this.vy * dt;
                }
            }

            /* ═══════════════════════════════════════════════
               GLASS SURFACE (WebGL distortion)
               ═══════════════════════════════════════════════ */
            function initGlassSurface() {
                const canvas = document.getElementById('glass-canvas');
                const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false });
                if (!gl) return;

                const btn = document.getElementById('glass-btn');

                function resize() {
                    const r = btn.getBoundingClientRect();
                    canvas.width = r.width * devicePixelRatio;
                    canvas.height = r.height * devicePixelRatio;
                }
                resize();
                window.addEventListener('resize', resize);

                const vs = `
                    attribute vec2 a_pos;
                    varying vec2 v_uv;
                    void main() {
                        v_uv = a_pos * 0.5 + 0.5;
                        gl_Position = vec4(a_pos, 0.0, 1.0);
                    }
                `;

                const fs = `
                    precision mediump float;
                    varying vec2 v_uv;
                    uniform float u_time;
                    uniform vec2 u_mouse;
                    uniform float u_hover;

                    // Simplex-ish noise
                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                    }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i);
                        float b = hash(i + vec2(1.0, 0.0));
                        float c = hash(i + vec2(0.0, 1.0));
                        float d = hash(i + vec2(1.0, 1.0));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    void main() {
                        vec2 uv = v_uv;

                        // Displacement from noise
                        float displace = 0.5 + u_hover * 0.3;
                        float n = noise(uv * 3.0 + u_time * 0.3) * displace;
                        vec2 offset = vec2(
                            noise(uv * 4.0 + u_time * 0.2) - 0.5,
                            noise(uv * 4.0 + u_time * 0.25 + 50.0) - 0.5
                        ) * 0.015 * (1.0 + u_hover);

                        // Chromatic aberration — offset R/G/B channels
                        float distortionScale = -180.0 * (0.5 + u_hover * 0.5);
                        float redOff = offset.y * distortionScale * 0.00005;
                        float greenOff = offset.x * distortionScale * 0.00008;
                        float blueOff = offset.y * distortionScale * 0.00012;

                        // Dark glass base with subtle noise variation
                        float r = 0.06 + n * 0.03 + redOff;
                        float g = 0.06 + n * 0.02 + greenOff;
                        float b = 0.08 + n * 0.03 + blueOff;

                        // Subtle edge rim
                        float edge = smoothstep(0.0, 0.12, uv.x) * smoothstep(0.0, 0.12, 1.0 - uv.x)
                                   * smoothstep(0.0, 0.18, uv.y) * smoothstep(0.0, 0.18, 1.0 - uv.y);
                        float rim = 1.0 - edge;
                        r += rim * 0.04;
                        g += rim * 0.04;
                        b += rim * 0.06;

                        // Circular specular highlight follows mouse
                        float d = length((uv - u_mouse) * vec2(1.0, 2.2));
                        float spec = smoothstep(0.25, 0.0, d) * 0.35 * u_hover;
                        r += spec * 0.9;
                        g += spec * 0.9;
                        b += spec * 1.1;

                        gl_FragColor = vec4(r, g, b, 0.97);
                    }
                `;

                function compile(type, src) {
                    const s = gl.createShader(type);
                    gl.shaderSource(s, src);
                    gl.compileShader(s);
                    return s;
                }
                const prog = gl.createProgram();
                gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
                gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
                gl.linkProgram(prog);
                gl.useProgram(prog);

                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
                const aPos = gl.getAttribLocation(prog, 'a_pos');
                gl.enableVertexAttribArray(aPos);
                gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

                const uTime = gl.getUniformLocation(prog, 'u_time');
                const uMouse = gl.getUniformLocation(prog, 'u_mouse');
                const uHover = gl.getUniformLocation(prog, 'u_hover');

                let hovered = 0;
                let hoverTarget = 0;
                btn.addEventListener('mouseenter', () => { hoverTarget = 1; });
                btn.addEventListener('mouseleave', () => { hoverTarget = 0; });

                let localMx = 0.5, localMy = 0.5;
                btn.addEventListener('mousemove', (e) => {
                    const r = btn.getBoundingClientRect();
                    localMx = (e.clientX - r.left) / r.width;
                    localMy = 1.0 - (e.clientY - r.top) / r.height;
                });

                const t0 = performance.now();

                (function frame() {
                    const t = (performance.now() - t0) * 0.001;
                    hovered += (hoverTarget - hovered) * 0.08;

                    gl.viewport(0, 0, canvas.width, canvas.height);
                    gl.uniform1f(uTime, t);
                    gl.uniform2f(uMouse, localMx, localMy);
                    gl.uniform1f(uHover, hovered);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                    requestAnimationFrame(frame);
                })();
            }

            /* ═══════════════════════════════════════════════
               SHARED MOUSE STATE
               ═══════════════════════════════════════════════ */
            const mouse = { nx: 0, ny: 0, clientX: 0, clientY: 0, svgX: 0, svgY: 0, inEmpty: false };
            const mobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

            if (!mobile) {
                document.addEventListener('mousemove', e => {
                    mouse.clientX = e.clientX;
                    mouse.clientY = e.clientY;
                    mouse.nx = e.clientX / window.innerWidth - 0.5;
                    mouse.ny = e.clientY / window.innerHeight - 0.5;
                    mouse.inEmpty = !e.target.closest('svg') && !e.target.closest('.subtext');
                    // Flashlight tracking on grid
                    document.getElementById('grid-overlay').style.setProperty('--mx', e.clientX + 'px');
                    document.getElementById('grid-overlay').style.setProperty('--my', e.clientY + 'px');
                });
            }

            /* ═══════════════════════════════════════════════
               FLOATING PARTICLES
               ═══════════════════════════════════════════════ */
            function initParticles() {
                const cvs = document.getElementById('particle-canvas');
                const ctx = cvs.getContext('2d');
                let w, h;

                function resize() {
                    w = cvs.width = window.innerWidth;
                    h = cvs.height = window.innerHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                const N = 12;
                const pts = [];
                for (let i = 0; i < N; i++) {
                    pts.push({
                        x: Math.random() * (w || 1400),
                        y: Math.random() * (h || 900),
                        vx: (Math.random() - 0.5) * 0.15,
                        vy: -Math.random() * 0.1 - 0.02,
                        alpha: Math.random() * 0.3 + 0.15,
                        size: Math.random() < 0.3 ? 2 : 1
                    });
                }

                (function tick() {
                    ctx.clearRect(0, 0, w, h);
                    for (const p of pts) {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < -10) p.x = w + 10;
                        if (p.x > w + 10) p.x = -10;
                        if (p.y < -10) p.y = h + 10;
                        if (p.y > h + 10) p.y = -10;
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = '#777';
                        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
                    }
                    ctx.globalAlpha = 1;
                    requestAnimationFrame(tick);
                })();
            }

            /* ═══════════════════════════════════════════════
               SPLIT ECHOES (chromatic breathing)
               ═══════════════════════════════════════════════ */
            function initSplitEchoes() {
                const cyan = document.querySelector('.ghost-cyan');
                const magenta = document.querySelector('.ghost-magenta');
                const t0 = performance.now();

                (function tick() {
                    const t = (performance.now() - t0) * 0.001;

                    // Slow breathing cycle: ~10s split apart, ~10s recombine
                    const breath = Math.sin(t * 0.3) * 0.5 + 0.5; // 0→1→0
                    const split = breath * 25; // max 25px separation

                    // Slight horizontal drift with mouse
                    const mx = mouse.nx * 8;

                    cyan.style.opacity = breath * 0.04;
                    cyan.style.transform = `translate(${-split + mx}px, ${-split * 0.4}px)`;

                    magenta.style.opacity = breath * 0.04;
                    magenta.style.transform = `translate(${split + mx}px, ${split * 0.4}px)`;

                    requestAnimationFrame(tick);
                })();
            }

            /* ═══════════════════════════════════════════════
               BUILD
               ═══════════════════════════════════════════════ */
            document.fonts.ready.then(() => requestAnimationFrame(build));

            function build() {
                /* ── Phase 1: off-screen, measure, set viewBox ── */
                svg.setAttribute('viewBox', '0 0 3000 300');
                svg.style.position = 'absolute'; svg.style.left = '-9999px';

                const baseY = FS + 50;
                const baseText = mkEl('text', { ...txtAttrs, x: 100, y: baseY, id: 'text-base' });
                baseText.textContent = TXT;
                svg.appendChild(baseText);

                const bb = baseText.getBBox();
                const dotR = FS * 0.045;
                const roughLast = baseText.getExtentOfChar(TXT.length - 1);
                const roughDotCx = roughLast.x + roughLast.width + FS * 0.02 + dotR;
                const pad = 20;
                const vbX = bb.x - pad;
                const vbY = bb.y - pad;
                const vbW = (roughDotCx + dotR + pad) - vbX;
                const vbH = bb.height + pad * 2;
                svg.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);

                svg.removeAttribute('style');
                svg.style.overflow = 'visible';
                svg.style.display = 'block';
                svg.style.margin = '0 auto';
                svg.style.width = window.innerWidth < 600 ? '85vw' : '60vw';
                svg.style.maxWidth = '700px';
                svg.style.height = 'auto';

                /* ── Phase 2: on-screen measurements & full assembly ── */
                requestAnimationFrame(() => {
                    const pE = baseText.getExtentOfChar(0);
                    const xE = baseText.getExtentOfChar(7);
                    const lastE = baseText.getExtentOfChar(TXT.length - 1);
                    const bbLive = baseText.getBBox();

                    const plxBounds = {
                        x: pE.x, y: pE.y,
                        width: (xE.x + xE.width) - pE.x,
                        height: pE.height,
                        centerY: pE.y + pE.height / 2
                    };

                    const svgRect = svg.getBoundingClientRect();
                    const pxToSvg = svg.viewBox.baseVal.width / svgRect.width;
                    const baseOff = 10 * pxToSvg;
                    const metaFS = 6 * pxToSvg;
                    const metaGap = 6 * pxToSvg;

                    /* ── Defs: clip-path + sphere gradients ── */
                    const clipM = 4, clipI = 1;
                    const oX = vbX - pad, oY = vbY - pad;
                    const oW = vbW + pad * 4, oH = vbH + pad * 4;
                    const defs = mkEl('defs', {});

                    // Clip-path for P
                    const cp = mkEl('clipPath', { id: 'clip-hide-PI' });
                    const pClipX = pE.x - clipM, pClipW = pE.width + clipM + clipI;
                    const clipEl = mkEl('path', {
                        'clip-rule': 'evenodd',
                        d: `M${oX},${oY} h${oW} v${oH} h${-oW}Z ` +
                            `M${pClipX},${pE.y - clipM} v${pE.height + clipM * 2} h${pClipW} v${-(pE.height + clipM * 2)}Z`
                    });
                    cp.appendChild(clipEl);
                    defs.appendChild(cp);

                    // Sphere 3D gradient (highlight offset for faux-3D)
                    const sphereGrad = mkEl('radialGradient', { id: 'sphere-grad', cx: '0.38', cy: '0.35', r: '0.65' });
                    [['0%', '#666'], ['35%', '#444'], ['70%', '#222'], ['100%', '#0D0D0D']].forEach(([o, c]) => {
                        sphereGrad.appendChild(mkEl('stop', { offset: o, 'stop-color': c }));
                    });
                    defs.appendChild(sphereGrad);

                    // Sphere glow gradient
                    const glowGrad = mkEl('radialGradient', { id: 'sphere-glow-grad' });
                    glowGrad.appendChild(mkEl('stop', { offset: '0%', 'stop-color': '#555', 'stop-opacity': '0.12' }));
                    glowGrad.appendChild(mkEl('stop', { offset: '100%', 'stop-color': '#555', 'stop-opacity': '0' }));
                    defs.appendChild(glowGrad);

                    svg.insertBefore(defs, svg.firstChild);
                    baseText.setAttribute('clip-path', 'url(#clip-hide-PI)');

                    /* ── Echo layers ── */
                    const echoAttrs = { ...txtAttrs, 'pointer-events': 'none', opacity: 0 };
                    const echoCyan = mkEl('text', { ...echoAttrs, fill: '#00FFFF', x: 100, y: baseY });
                    echoCyan.textContent = 'Parallax';
                    svg.insertBefore(echoCyan, baseText);
                    const echoMagenta = mkEl('text', { ...echoAttrs, fill: '#FF00FF', x: 100, y: baseY });
                    echoMagenta.textContent = 'Parallax';
                    svg.insertBefore(echoMagenta, baseText);

                    /* ── Movable P ── */
                    const gP = mkEl('g', { id: 'letter-P' });
                    const tP = mkEl('text', { ...txtAttrs, x: pE.x, y: baseY });
                    tP.textContent = 'P'; gP.appendChild(tP); svg.appendChild(gP);

                    /* ── Period group (with sphere + reticle) ── */
                    const dotCx = lastE.x + lastE.width + FS * 0.02 + dotR;
                    const dotCy = baseY - dotR;
                    const expandedR = dotR * 12;

                    const pg = mkEl('g', { id: 'period-group' });

                    // Sphere glow & body (behind period circles)
                    const sphereGlow = mkEl('circle', {
                        cx: dotCx, cy: dotCy, r: 0,
                        fill: 'url(#sphere-glow-grad)', opacity: 0, 'pointer-events': 'none'
                    });
                    const sphereBody = mkEl('circle', {
                        cx: dotCx, cy: dotCy, r: 0,
                        fill: 'url(#sphere-grad)', opacity: 0, 'pointer-events': 'none'
                    });

                    // Period circles
                    const cC = mkEl('circle', { cx: dotCx, cy: dotCy, r: dotR, fill: '#00FFFF', opacity: 0.6 });
                    const mC = mkEl('circle', { cx: dotCx, cy: dotCy, r: dotR, fill: '#FF00FF', opacity: 0.6 });
                    const nC = mkEl('circle', { cx: dotCx, cy: dotCy, r: dotR, fill: FILL });

                    // Reticle group (centered at dot, all coords relative to 0,0)
                    const reticleG = mkEl('g', { opacity: 0, 'pointer-events': 'none' });

                    const rRad = expandedR * 0.82;
                    const reticleRing = mkEl('circle', {
                        cx: 0, cy: 0, r: rRad,
                        fill: 'none', stroke: '#555', 'stroke-width': 0.3, 'stroke-dasharray': '1.5 3'
                    });
                    const reticleH = mkEl('line', {
                        x1: -rRad, y1: 0, x2: rRad, y2: 0,
                        stroke: '#444', 'stroke-width': 0.15
                    });
                    const reticleV = mkEl('line', {
                        x1: 0, y1: -rRad, x2: 0, y2: rRad,
                        stroke: '#444', 'stroke-width': 0.15
                    });

                    // Tick marks at cardinal points
                    const tickLen = expandedR * 0.06;
                    const ticks = [];
                    for (let i = 0; i < 4; i++) {
                        const a = i * Math.PI / 2;
                        const r1 = rRad - tickLen, r2 = rRad + tickLen;
                        const t = mkEl('line', {
                            x1: Math.cos(a) * r1, y1: Math.sin(a) * r1,
                            x2: Math.cos(a) * r2, y2: Math.sin(a) * r2,
                            stroke: '#555', 'stroke-width': 0.25
                        });
                        ticks.push(t);
                    }

                    // Inner ring (concentric detail)
                    const innerRing = mkEl('circle', {
                        cx: 0, cy: 0, r: rRad * 0.45,
                        fill: 'none', stroke: '#333', 'stroke-width': 0.15, 'stroke-dasharray': '1 2.5'
                    });

                    // Cursor crosshair (moves with mouse inside sphere)
                    const cursorG = mkEl('g', {});
                    const curLen = dotR * 2.5;
                    const cursorH = mkEl('line', {
                        x1: -curLen, y1: 0, x2: curLen, y2: 0,
                        stroke: '#00FFFF', 'stroke-width': 0.35, opacity: 0.8
                    });
                    const cursorV = mkEl('line', {
                        x1: 0, y1: -curLen, x2: 0, y2: curLen,
                        stroke: '#FF00FF', 'stroke-width': 0.35, opacity: 0.8
                    });
                    const cursorDot = mkEl('circle', {
                        cx: 0, cy: 0, r: dotR * 0.4,
                        fill: 'none', stroke: '#fff', 'stroke-width': 0.2, opacity: 0.4
                    });
                    cursorG.append(cursorH, cursorV, cursorDot);

                    reticleG.append(reticleRing, reticleH, reticleV, innerRing, ...ticks, cursorG);

                    pg.append(sphereGlow, sphereBody, cC, mC, nC, reticleG);
                    svg.appendChild(pg);

                    // Period hover hit area (larger than visible dot for usability)
                    const dotHitR = 18 * pxToSvg;
                    const dotHit = mkEl('circle', {
                        cx: dotCx, cy: dotCy, r: dotHitR,
                        fill: 'transparent', cursor: 'crosshair', 'pointer-events': 'all'
                    });
                    svg.appendChild(dotHit);

                    /* ── Metadata ── */
                    const metaAttrs = {
                        'font-family': "'Inter', sans-serif", 'font-size': metaFS,
                        'font-weight': 300, 'letter-spacing': '0.12em',
                        fill: '#999', 'pointer-events': 'none'
                    };
                    const metaTopG = mkEl('g', { opacity: 0 });
                    const metaTopText = mkEl('text', { ...metaAttrs, x: plxBounds.x, y: plxBounds.y - metaGap });
                    metaTopText.textContent = 'OPTICAL DISPLACEMENT: 0.04ms  ·  DEPTH FIELD: 72pt  ·  LAYER: 01';
                    metaTopG.appendChild(metaTopText); svg.appendChild(metaTopG);

                    const metaBottomG = mkEl('g', { opacity: 0 });
                    const metaBottomText = mkEl('text', { ...metaAttrs, x: plxBounds.x, y: plxBounds.y + plxBounds.height + metaGap + metaFS });
                    metaBottomText.textContent = 'PERSPECTIVE SHIFT: ACTIVE  ·  DELAMINATION: 0.02°  ·  REF: PLX—2025';
                    metaBottomG.appendChild(metaBottomText); svg.appendChild(metaBottomG);

                    /* ── Parallax hit area ── */
                    const hitPad = 6;
                    const hitArea = mkEl('rect', {
                        x: plxBounds.x - hitPad, y: plxBounds.y - hitPad,
                        width: plxBounds.width + hitPad * 2, height: plxBounds.height + hitPad * 2,
                        fill: 'transparent', 'pointer-events': 'all'
                    });
                    svg.appendChild(hitArea);

                    /* ── Position horizon line ── */
                    const horizonLine = document.getElementById('horizon-line');
                    function positionHorizon() {
                        const r = svg.getBoundingClientRect();
                        const vb = svg.viewBox.baseVal;
                        const sc = r.width / vb.width;
                        horizonLine.style.top = (r.top + (plxBounds.centerY - vb.y) * sc) + 'px';
                    }
                    setTimeout(positionHorizon, 1600);
                    window.addEventListener('resize', positionHorizon);

                    /* ── Init particles ── */
                    initParticles();
                    initSplitEchoes();
                    initGlassSurface();

                    /* ── Start interaction ── */
                    startInteraction({
                        letters: { gP },
                        dot: { cC, mC, nC, dotCx, dotCy, dotR, pg, dotHit },
                        echoes: { echoCyan, echoMagenta, baseOff },
                        meta: { metaTopG, metaBottomG, metaSlide: baseOff * 0.6 },
                        sphere: { body: sphereBody, glow: sphereGlow, grad: sphereGrad, expandedR, reticleG, cursorG, pxToSvg },
                        hitArea, horizonLine
                    });
                });
            }

            /* ═══════════════════════════════════════════════
               INTERACTION LOOP
               ═══════════════════════════════════════════════ */
            function startInteraction(cfg) {
                const { letters, dot, echoes, meta, sphere, hitArea, horizonLine } = cfg;
                const gridOverlay = document.getElementById('grid-overlay');
                const heroWrapper = document.getElementById('hero-wrapper');

                /* ── Springs: original (P, I, period delamination) ── */
                const sP = new Spring(300, 20);
                const sCyan = new Spring(300, 20);
                const sMag = new Spring(300, 20);

                /* ── Springs: exploded view (stiffness 150, damping 25) ── */
                const sOpen = new Spring(150, 25);
                const sEchoCyanPx = new Spring(150, 25);
                const sEchoMagPx = new Spring(150, 25);

                /* ── Springs: kinetic fullstop (sphere, cursor, shiver) ── */
                const sDotExpand = new Spring(150, 25);
                const sCursor = new Spring(200, 22);
                const sShiver = new Spring(150, 25);

                /* ── Springs: cursor echo (easter egg) ── */
                const sCursorEcho = new Spring(80, 12);   // lazy floaty follow
                const sEchoShow = new Spring(150, 25);    // visibility spring
                const echoEl = document.getElementById('cursor-echo');
                const coordSpan = echoEl.querySelector('.echo-coord');

                /* ── Springs: lens portal ── */
                const sLens = new Spring(55, 10);   // slow, dramatic, languid iris
                const sWaitlistDrift = new Spring(60, 14); // content drifts up
                const sWaitlistTilt = new Spring(100, 16); // card parallax tilt
                const sChroma = new Spring(120, 18);       // chromatic aberration on heading
                let portalOpen = false;
                let portalClickX = 0;
                let portalClickY = 0;
                const landingPage = document.getElementById('landing-page');
                const waitlistPage = document.getElementById('waitlist-page');
                const waitlistContent = waitlistPage.querySelector('.text-center');
                const waitlistHeading = document.getElementById('waitlist-heading');
                const waitlistBack = document.getElementById('waitlist-back');
                const waitlistForm = document.getElementById('waitlist-form');
                const waitlistEmail = document.getElementById('waitlist-email');
                const waitlistSuccess = document.getElementById('waitlist-success');
                const subtextEl = document.querySelector('.subtext');

                /* ── Lens portal: click to open ── */
                subtextEl.addEventListener('click', (e) => {
                    if (portalOpen) return;
                    portalOpen = true;
                    portalClickX = e.clientX;
                    portalClickY = e.clientY;
                    sLens.aim(0, 1);
                    sWaitlistDrift.aim(0, 1);
                    waitlistPage.style.opacity = '1';
                    waitlistPage.style.pointerEvents = 'auto';
                    // Decrypt heading
                    waitlistHeading.innerHTML = '';
                    decryptText(waitlistHeading, 'Join the Waitlist', {
                        delay: 400, speed: 40, maxIterations: 8
                    });
                });

                /* ── Lens portal: back button ── */
                waitlistBack.addEventListener('click', () => {
                    if (!portalOpen) return;
                    portalOpen = false;
                    sLens.aim(0, 0);
                    sWaitlistDrift.aim(0, 0);
                    waitlistPage.style.pointerEvents = 'none';
                    setTimeout(() => {
                        waitlistEmail.value = '';
                        waitlistEmail.style.display = '';
                        waitlistForm.querySelector('button[type="submit"]').style.display = '';
                        waitlistSuccess.style.display = 'none';
                    }, 1000);
                });

                /* ── Lens portal: escape key ── */
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && portalOpen) waitlistBack.click();
                });

                /* ── Waitlist form submit (visual only) ── */
                waitlistForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    waitlistEmail.style.display = 'none';
                    waitlistForm.querySelector('button[type="submit"]').style.display = 'none';
                    waitlistSuccess.style.display = 'block';
                });

                /* ── Hover states ── */
                let parallaxHovered = false;
                hitArea.addEventListener('mouseenter', () => { parallaxHovered = true; });
                hitArea.addEventListener('mouseleave', () => { parallaxHovered = false; });

                let dotDirectHover = false;
                dot.dotHit.addEventListener('mouseenter', () => { dotDirectHover = true; });
                dot.dotHit.addEventListener('mouseleave', () => { dotDirectHover = false; });

                /* ── Period screen distance (updated in mousemove) ── */
                let dotScreenDist = Infinity;

                /* ── SVG scale ── */
                function svgScale() {
                    const r = svg.getBoundingClientRect();
                    const vb = svg.viewBox.baseVal;
                    return r.width > 0 ? vb.width / r.width : 1;
                }

                /* ── Desktop: mouse tracking ── */
                if (!mobile) {
                    document.addEventListener('mousemove', e => {
                        const vw = window.innerWidth, vh = window.innerHeight;
                        const mx = e.clientX / vw - 0.5;
                        const my = e.clientY / vh - 0.5;
                        const sc = svgScale();
                        const offX = -mx * vw * 0.02 * sc;
                        const offY = -my * vh * 0.02 * sc;
                        sP.aim(offX, offY);

                        // SVG coordinate conversion
                        const ctm = svg.getScreenCTM();
                        if (!ctm) return;
                        const pt = svg.createSVGPoint();
                        pt.x = e.clientX; pt.y = e.clientY;
                        const sp = pt.matrixTransform(ctm.inverse());
                        mouse.svgX = sp.x;
                        mouse.svgY = sp.y;

                        // Period screen distance
                        const dotScrX = dot.dotCx * ctm.a + ctm.e;
                        const dotScrY = dot.dotCy * ctm.d + ctm.f;
                        dotScreenDist = Math.hypot(e.clientX - dotScrX, e.clientY - dotScrY);

                        // Period delamination
                        const dx = sp.x - dot.dotCx, dy = sp.y - dot.dotCy;
                        const dist = Math.hypot(dx, dy);
                        const zone = dot.dotR * 25;
                        if (dist < zone && dist > 0.01) {
                            const intensity = Math.pow(1 - dist / zone, 1.5);
                            const maxOff = dot.dotR * 5;
                            const nx = dx / dist, ny = dy / dist;
                            sCyan.aim(-nx * intensity * maxOff, -ny * intensity * maxOff);
                            sMag.aim(nx * intensity * maxOff, ny * intensity * maxOff);
                        } else {
                            sCyan.aim(0, 0); sMag.aim(0, 0);
                        }
                    });
                }

                /* ── Mobile: gyroscope ── */
                if (mobile) {
                    function onOrientation(e) {
                        const gamma = e.gamma || 0;
                        const beta = (e.beta || 45) - 45;
                        const sc = svgScale();
                        const f = 0.3 * sc;
                        sP.aim(-gamma * f, -beta * f);
                        sCyan.aim(-gamma * 0.1, -beta * 0.1);
                        sMag.aim(gamma * 0.1, beta * 0.1);
                    }
                    if (typeof DeviceOrientationEvent !== 'undefined' &&
                        typeof DeviceOrientationEvent.requestPermission === 'function') {
                        document.addEventListener('touchstart', function once() {
                            DeviceOrientationEvent.requestPermission().then(r => {
                                if (r === 'granted') window.addEventListener('deviceorientation', onOrientation);
                            });
                            document.removeEventListener('touchstart', once);
                        }, { once: true });
                    } else {
                        window.addEventListener('deviceorientation', onOrientation);
                    }
                }

                /* ═══ RENDER LOOP ═══ */
                let prev = performance.now();

                (function loop(now) {
                    const dt = Math.min((now - prev) / 1000, 0.05);
                    prev = now;

                    // ── Tick springs ──
                    sP.tick(dt); sCyan.tick(dt); sMag.tick(dt);
                    sOpen.tick(dt); sEchoCyanPx.tick(dt); sEchoMagPx.tick(dt);
                    sDotExpand.tick(dt); sCursor.tick(dt); sShiver.tick(dt);
                    sCursorEcho.tick(dt); sEchoShow.tick(dt);
                    sLens.tick(dt); sWaitlistDrift.tick(dt);
                    sWaitlistTilt.tick(dt); sChroma.tick(dt);

                    // ──────────────────────────────────────
                    //  PERIOD: KINETIC FULLSTOP
                    // ──────────────────────────────────────
                    const vibeIntensity = dotScreenDist < 50 ? clamp01(1 - dotScreenDist / 50) : 0;
                    sDotExpand.aim(0, dotDirectHover ? 1 : 0);
                    sShiver.aim(0, dotDirectHover ? 1 : 0);
                    const expand = clamp01(sDotExpand.py);
                    const shiver = clamp01(sShiver.py);

                    // Vibration jitter (high-frequency, 0.5px)
                    if (vibeIntensity > 0.005) {
                        const amp = dot.dotR * 0.09 * vibeIntensity;
                        const jx = (Math.random() - 0.5) * 2 * amp;
                        const jy = (Math.random() - 0.5) * 2 * amp;
                        dot.pg.setAttribute('transform', `translate(${jx},${jy})`);
                    } else if (expand < 0.01) {
                        dot.pg.setAttribute('transform', '');
                    }

                    // Sphere expansion
                    const curR = dot.dotR + (sphere.expandedR - dot.dotR) * expand;
                    sphere.body.setAttribute('r', curR);
                    sphere.body.setAttribute('opacity', expand * 0.95);
                    sphere.glow.setAttribute('r', curR * 1.6);
                    sphere.glow.setAttribute('opacity', expand * 0.5);

                    // Sphere 3D highlight follows mouse
                    if (expand > 0.05) {
                        const relX = (mouse.svgX - dot.dotCx) / sphere.expandedR;
                        const relY = (mouse.svgY - dot.dotCy) / sphere.expandedR;
                        sphere.grad.setAttribute('cx', (0.38 + clamp01(relX * 0.15 + 0.5) * 0.2 - 0.1).toFixed(3));
                        sphere.grad.setAttribute('cy', (0.35 + clamp01(relY * 0.15 + 0.5) * 0.2 - 0.1).toFixed(3));
                    }

                    // Period circles expand with sphere
                    const cyanR = dot.dotR + (sphere.expandedR * 0.9 - dot.dotR) * expand;
                    const magR = dot.dotR + (sphere.expandedR * 0.9 - dot.dotR) * expand;
                    dot.cC.setAttribute('r', cyanR);
                    dot.mC.setAttribute('r', magR);
                    dot.cC.setAttribute('opacity', 0.6 - expand * 0.45);
                    dot.mC.setAttribute('opacity', 0.6 - expand * 0.45);
                    dot.nC.setAttribute('opacity', 1 - expand * 0.6);

                    // Reticle
                    const reticleOpacity = expand > 0.35 ? (expand - 0.35) / 0.65 : 0;
                    sphere.reticleG.setAttribute('opacity', reticleOpacity);
                    sphere.reticleG.setAttribute('transform', `translate(${dot.dotCx},${dot.dotCy}) scale(${Math.max(0.01, expand)})`);

                    // Reticle cursor tracking (spring-smoothed)
                    if (expand > 0.1) {
                        const dx = mouse.svgX - dot.dotCx;
                        const dy = mouse.svgY - dot.dotCy;
                        const d = Math.hypot(dx, dy);
                        const maxR = sphere.expandedR * 0.7;
                        const clampD = Math.min(d, maxR);
                        const cx = d > 0.01 ? (dx / d) * clampD / Math.max(expand, 0.1) : 0;
                        const cy = d > 0.01 ? (dy / d) * clampD / Math.max(expand, 0.1) : 0;
                        sCursor.aim(cx, cy);
                    } else {
                        sCursor.aim(0, 0);
                    }
                    sphere.cursorG.setAttribute('transform', `translate(${sCursor.px},${sCursor.py})`);

                    // Text shiver (whole hero trembles when period is "activated")
                    if (shiver > 0.01) {
                        const freq = now * 0.05;
                        const sx = Math.sin(freq * 7.1) * 0.35 * shiver;
                        const sy = Math.cos(freq * 5.3) * 0.25 * shiver;
                        heroWrapper.style.transform = `translate(${sx}px,${sy}px)`;
                    } else {
                        heroWrapper.style.transform = '';
                    }

                    // ──────────────────────────────────────
                    //  P / I / PERIOD DELAMINATION
                    // ──────────────────────────────────────
                    letters.gP.setAttribute('transform', `translate(${sP.px},${sP.py})`);
                    dot.cC.setAttribute('transform', `translate(${sCyan.px},${sCyan.py})`);
                    dot.mC.setAttribute('transform', `translate(${sMag.px},${sMag.py})`);

                    // ──────────────────────────────────────
                    //  EXPLODED VIEW (Parallax hover)
                    // ──────────────────────────────────────
                    sOpen.aim(0, parallaxHovered ? 1 : 0);

                    const pxFactor = FS * 0.22;
                    const pxFactorSmall = FS * 0.10;
                    if (parallaxHovered) {
                        sEchoCyanPx.aim(mouse.nx * pxFactor, mouse.ny * pxFactor * 0.6);
                        sEchoMagPx.aim(-mouse.nx * pxFactorSmall, -mouse.ny * pxFactorSmall * 0.6);
                    } else {
                        sEchoCyanPx.aim(0, 0);
                        sEchoMagPx.aim(0, 0);
                    }

                    const open = clamp01(sOpen.py);

                    const cyanTx = sEchoCyanPx.px * open;
                    const cyanTy = -echoes.baseOff * open + sEchoCyanPx.py * open;
                    echoes.echoCyan.setAttribute('transform', `translate(${cyanTx},${cyanTy})`);
                    echoes.echoCyan.setAttribute('opacity', open * 0.2);

                    const magTx = sEchoMagPx.px * open;
                    const magTy = echoes.baseOff * open + sEchoMagPx.py * open;
                    echoes.echoMagenta.setAttribute('transform', `translate(${magTx},${magTy})`);
                    echoes.echoMagenta.setAttribute('opacity', open * 0.2);

                    horizonLine.style.opacity = open * 0.5;
                    horizonLine.style.transform = `scaleX(${open})`;

                    meta.metaTopG.setAttribute('opacity', open);
                    meta.metaTopG.setAttribute('transform', `translate(0,${-meta.metaSlide * open})`);
                    meta.metaBottomG.setAttribute('opacity', open);
                    meta.metaBottomG.setAttribute('transform', `translate(0,${meta.metaSlide * open})`);

                    // Grid: always visible, boost on Parallax hover
                    gridOverlay.style.opacity = 1 + open * 0.5;

                    // ──────────────────────────────────────
                    //  CURSOR ECHO (empty-space easter egg)
                    // ──────────────────────────────────────
                    sCursorEcho.aim(mouse.clientX, mouse.clientY);
                    sEchoShow.aim(0, mouse.inEmpty ? 1 : 0);
                    const echoVis = clamp01(sEchoShow.py);
                    echoEl.style.opacity = echoVis;
                    echoEl.style.transform = `translate(${sCursorEcho.px}px,${sCursorEcho.py}px)`;
                    if (echoVis > 0.01) {
                        coordSpan.textContent = `${Math.round(mouse.clientX)}, ${Math.round(mouse.clientY)}`;
                    }

                    // ──────────────────────────────────────
                    //  WAITLIST HOVER EFFECTS
                    // ──────────────────────────────────────
                    if (portalOpen) {
                        // Subtle parallax tilt follows mouse (±8px)
                        sWaitlistTilt.aim(mouse.nx * 16, mouse.ny * 10);
                        // Chromatic split follows mouse (±3px)
                        sChroma.aim(mouse.nx * 6, mouse.ny * 4);
                    } else {
                        sWaitlistTilt.aim(0, 0);
                        sChroma.aim(0, 0);
                    }

                    // ──────────────────────────────────────
                    //  LENS PORTAL
                    // ──────────────────────────────────────
                    const lensProgress = clamp01(sLens.py);
                    const driftProgress = clamp01(sWaitlistDrift.py);

                    if (lensProgress > 0.001) {
                        const vw = window.innerWidth;
                        const vh = window.innerHeight;
                        const maxDist = Math.hypot(
                            Math.max(portalClickX, vw - portalClickX),
                            Math.max(portalClickY, vh - portalClickY)
                        );
                        const maxRadius = maxDist * 1.1;
                        const radius = maxRadius * (1 - lensProgress);

                        // Clip the landing page iris-style
                        landingPage.style.clipPath =
                            `circle(${radius}px at ${portalClickX}px ${portalClickY}px)`;

                        // Subtle zoom on landing as it clips away
                        const zoom = 1 + lensProgress * 0.04;
                        landingPage.style.transform = `scale(${zoom})`;

                        // Waitlist fades in
                        waitlistPage.style.opacity = lensProgress > 0.2
                            ? Math.min(1, (lensProgress - 0.2) / 0.5)
                            : 0;

                        // Content drifts up from 30px below + parallax tilt
                        const drift = 30 * (1 - driftProgress);
                        const tiltX = sWaitlistTilt.px;
                        const tiltY = sWaitlistTilt.py;
                        waitlistContent.style.transform =
                            `translateY(${drift}px) translate(${tiltX}px,${tiltY}px)`;
                        waitlistContent.style.opacity = driftProgress;

                        // Chromatic aberration on heading
                        const cx = sChroma.px;
                        const cy = sChroma.py;
                        if (Math.abs(cx) > 0.05 || Math.abs(cy) > 0.05) {
                            waitlistHeading.style.textShadow =
                                `${cx}px ${cy}px 0 rgba(0,255,255,0.18), ${-cx}px ${-cy}px 0 rgba(255,0,255,0.18)`;
                        } else {
                            waitlistHeading.style.textShadow = '';
                        }
                    } else {
                        landingPage.style.clipPath = '';
                        landingPage.style.transform = '';
                        waitlistPage.style.opacity = '0';
                        waitlistPage.style.pointerEvents = 'none';
                        waitlistContent.style.transform = '';
                        waitlistContent.style.opacity = '0';
                        waitlistHeading.style.textShadow = '';
                    }

                    if (lensProgress > 0.99) {
                        landingPage.style.pointerEvents = 'none';
                    } else {
                        landingPage.style.pointerEvents = '';
                    }

                    requestAnimationFrame(loop);
                })(prev);
            }
        })();
    </script>
</body>

</html>
